<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">Site Monitor extension card</title>
  <desc id="desc">Preview card for public uptime, SSL, domain, and incident monitoring.</desc>
  <rect width="1200" height="675" fill="#111827"/>
  <rect x="72" y="72" width="1056" height="531" rx="18" fill="#f8fafc"/>
  <text x="126" y="158" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">Site Monitor</text>
  <text x="126" y="215" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="28">Uptime, SSL, domain, and incident evidence for Capell operators.</text>
  <rect x="126" y="286" width="260" height="148" rx="14" fill="#dcfce7"/>
  <text x="158" y="346" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">HTTP</text>
  <text x="158" y="388" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">Passing</text>
  <rect x="422" y="286" width="260" height="148" rx="14" fill="#fef3c7"/>
  <text x="454" y="346" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">SSL</text>
  <text x="454" y="388" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">28 days</text>
  <rect x="718" y="286" width="260" height="148" rx="14" fill="#fee2e2"/>
  <text x="750" y="346" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Incident</text>
  <text x="750" y="388" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">Open</text>
  <line x1="126" y1="500" x2="1024" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <text x="126" y="550" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="24">Runs on queues and console commands. No public frontend output.</text>
</svg>
